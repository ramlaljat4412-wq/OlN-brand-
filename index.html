            { id: 12, name: "Exclusive", price: 200, color: "Mixed", img: "https://img.sanishtech.com/u/e134daba364b39c5439ced3f9ee62a0f.png", category: "200" },
            { id: 13, name: "Premium Edition", price: 200, color: "Mixed", img: "https://img.sanishtech.com/u/8043ffc9d750093e4e4715624b3d37e0.png", category: "200" },
            { id: 14, name: "Special Fit", price: 200, color: "Mixed", img: "https://img.sanishtech.com/u/5f88c5ab9efb321c9a55d9b6567a2dcf.jpg", category: "200" },

            { id: 26, name: "Denim Style", price: 200, color: "Mixed", img: "https://img.sanishtech.com/u/217f8bf8cb040d1edfa16f0f572e43eb.jpg", category: "200" },
            { id: 27, name: "Urban Outfit", price: 200, color: "Mixed", img: "https://img.sanishtech.com/u/082f997de8032803da4ab77b6521314e.jpg", category: "200" },
            { id: 28, name: "Street Collection", price: 200, color: "Mixed", img: "https://img.sanishtech.com/u/74ba70794eadfb51bb06818d11493d40.jpg", category: "200" },
            { id: 29, name: "Fashion Edition", price: 200, color: "Mixed", img: "https://img.sanishtech.com/u/f1f6ac1e0ad6368417b3e8d5f5e2d612.jpg", category: "200" },
            { id: 30, name: "Winter Wear", price: 200, color: "Mixed", img: "https://img.sanishtech.com/u/bc4ceae21bc8e3aed1c9848f5604bc60.jpg", category: "200" },

            // 500 Rs Combo Pack
            { id: 16, name: "Special Combo Pack", price: 500, color: "Multi", img: "https://img.sanishtech.com/u/7666e9ca27a0c39bb971915fe9f85a0a.jpg", category: "500" },

            // 300 Rs Products
            { id: 31, name: "Premium Set", price: 300, color: "Mixed", img: "https://img.sanishtech.com/u/9fe162d5cb4ec0bb6903dda5d4d44a04.jpg", category: "300" },
            { id: 32, name: "Luxury Wear", price: 300, color: "Mixed", img: "https://img.sanishtech.com/u/4cd360bb78ed9d6ed90d4d017ce9965f.jpg", category: "300" },
            { id: 33, name: "Designer Collection", price: 300, color: "Mixed", img: "https://img.sanishtech.com/u/751f49349fc03dd5cc3dd9c600e812aa.webp", category: "300" },
            { id: 34, name: "Elite Fit", price: 300, color: "Mixed", img: "https://img.sanishtech.com/u/910f9d26979fb19254946dfda2703277.webp", category: "300" },

            // 100 Rs Products
            { id: 17, name: "Basic Item", price: 100, color: "Mixed", img: "https://img.sanishtech.com/u/9e96a5205a6bd4dd5d97fe4ce46a8332.jpg", category: "100" },
            { id: 18, name: "Basic Item 2", price: 100, color: "Mixed", img: "https://img.sanishtech.com/u/e9221c02717c369c4223ea57a61cb5ff.jpg", category: "100" },
            { id: 19, name: "Basic Item 3", price: 100, color: "Mixed", img: "https://img.sanishtech.com/u/43cff5276635deb8847aa63f2c4116bf.jpg", category: "100" },
            { id: 20, name: "Basic Item 4", price: 100, color: "Mixed", img: "https://img.sanishtech.com/u/836df3a62e13a68bb95dcbbb45224513.jpg", category: "100" },
            { id: 21, name: "Accessory 1", price: 100, color: "Mixed", img: "https://img.sanishtech.com/u/0b986d4abb3c7bc4b18523f216140248.jpg", category: "100" },
            { id: 22, name: "Accessory 2", price: 100, color: "Mixed", img: "https://img.sanishtech.com/u/f4a96892a51b6d16992554c5343ae596.jpg", category: "100" },
            { id: 23, name: "Accessory 3", price: 100, color: "Mixed", img: "https://img.sanishtech.com/u/166acbe20b982e066ca12027454834f6.jpg", category: "100" },
            { id: 24, name: "Accessory 4", price: 100, color: "Mixed", img: "https://img.sanishtech.com/u/02600bbc82b3edf72435fcb5a995ab3c.jpg", category: "100" },
            { id: 25, name: "Accessory 5", price: 100, color: "Mixed", img: "https://img.sanishtech.com/u/e13f04fd128f0fddd8a61379b00790a6.jpg", category: "100" }
        ];

        const App = () => {
            const [currentView, setCurrentView] = useState('login');
            const [cart, setCart] = useState([]);
            const [shoeSize, setShoeSize] = useState('8');
            const [loginDetails, setLoginDetails] = useState({ name: '', phone: '' });
            
            // Detailed Address State
            const [address, setAddress] = useState({
                house: '',
                area: '',
                city: '',
                state: '',
                pin: '',
                altPhone: ''
            });
            
            const [utr, setUtr] = useState('');
            const [utrError, setUtrError] = useState(false);
            const [selectedSizes, setSelectedSizes] = useState({});

            const DELIVERY_FEE = 20;

            const handleSizeChange = (productId, size) => {
                setSelectedSizes(prev => ({ ...prev, [productId]: size }));
            };

            const addToCart = (product) => {
                const size = selectedSizes[product.id] || 'M'; // Default to M if not selected
                
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id && item.size === size);
                    if (existing) {
                        return prev.map(item => (item.id === product.id && item.size === size) ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { ...product, quantity: 1, size: size }];
                });
            };

            const updateQuantity = (id, size, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id && item.size === size) {
                        const newQ = item.quantity + delta;
                        return newQ > 0 ? { ...item, quantity: newQ } : item;
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const totals = useMemo(() => {
                let total200Count = 0; 
                let rawTotal = 0;
                
                cart.forEach(item => {
                    rawTotal += item.price * item.quantity;
                    if (item.category === '200' || item.category === '200_top') {
                        total200Count += item.quantity;
                    }
                });
                
                const groupsOf3 = Math.floor(total200Count / 3);
                const remainder = total200Count % 3;
                const priceFor200s = (groupsOf3 * 500) + (remainder * 200);

                let otherTotal = 0;
                cart.forEach(item => { 
                    if (item.category !== '200' && item.category !== '200_top') {
                        otherTotal += item.price * item.quantity; 
                    }
                });

                const itemsTotal = priceFor200s + otherTotal;
                const discount = rawTotal - itemsTotal;
                
                // Final calculation with delivery fee
                const finalTotal = itemsTotal > 0 ? itemsTotal + DELIVERY_FEE : 0;
                const hasFreeShoes = itemsTotal >= 500;
                const itemCount = cart.reduce((acc, curr) => acc + curr.quantity, 0);

                return { rawTotal, itemsTotal, discount, finalTotal, hasFreeShoes, itemCount };
            }, [cart]);

            const renderLogin = () => (
                <div className="min-h-screen bg-gradient-to-br from-purple-900 to-black flex flex-col items-center justify-center p-4 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-full bg-[url('https://img.sanishtech.com/u/bb515368aae700c85954bc3cb328e9c5.png')] bg-cover opacity-5 blur-xl"></div>
                    <div className="glass p-8 rounded-3xl w-full max-w-md text-center shadow-2xl border border-white/20 relative z-10">
                        <img src="https://img.sanishtech.com/u/bb515368aae700c85954bc3cb328e9c5.png" alt="OLN BRANDS" className="w-32 mx-auto mb-6 drop-shadow-[0_0_15px_rgba(255,255,255,0.2)] animate-pulse" />
                        <h1 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 mb-2 tracking-widest">OLN BRANDS</h1>
                        <p className="text-gray-300 mb-8 text-sm font-medium">Exclusive Collection</p>
                        
                        <form onSubmit={(e) => { e.preventDefault(); if(loginDetails.name && loginDetails.phone.length >= 10) setCurrentView('home'); }} className="space-y-5">
                            <div className="relative">
                                <input type="text" placeholder="Full Name" required value={loginDetails.name} onChange={e => setLoginDetails({...loginDetails, name: e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-xl py-4 px-5 text-white placeholder-white/40 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition-all shadow-inner" />
                            </div>
                            <div className="relative">
                                <input type="tel" placeholder="Mobile Number" required value={loginDetails.phone} onChange={e => setLoginDetails({...loginDetails, phone: e.target.value.replace(/[^0-9]/g, '')})} maxLength="10" className="w-full bg-black/40 border border-white/10 rounded-xl py-4 px-5 text-white placeholder-white/40 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition-all shadow-inner" />
                            </div>
                            <button type="submit" className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-black text-lg py-4 rounded-xl hover:scale-105 transition-transform shadow-[0_0_20px_rgba(219,39,119,0.4)] mt-2">
                                ENTER SHOP ➔
                            </button>
                        </form>
                    </div>
                </div>
            );

            const renderHome = () => (
                <div className="pb-24">
                    <div className="bg-gradient-to-r from-purple-800 to-pink-700 text-white text-center py-2 px-4 text-xs md:text-sm font-bold sticky top-0 z-50 shadow-md whitespace-nowrap overflow-hidden">
                        <marquee behavior="scroll" direction="left">🔥 ADD 3 ITEMS (₹200) TO GET THEM FOR ₹500 + FREE SHOES ON ORDERS ₹500 & ABOVE! 🔥</marquee>
                    </div>
                    
                    <div className="p-4 flex justify-between items-center bg-gray-900 border-b border-gray-800 sticky top-8 z-40">
                        <div className="flex items-center gap-3">
                            <img src="https://img.sanishtech.com/u/bb515368aae700c85954bc3cb328e9c5.png" alt="Logo" className="h-10" />
                            <h1 className="font-black tracking-widest text-lg">OLN BRANDS</h1>
                        </div>
                        <button onClick={() => setCurrentView('cart')} className="relative bg-white/10 p-2.5 rounded-xl border border-white/20 hover:bg-white/20 transition">
                            🛒 <span className="absolute -top-2 -right-2 bg-pink-600 text-white text-xs font-black w-6 h-6 rounded-full flex items-center justify-center shadow-lg">{totals.itemCount}</span>
                        </button>
                    </div>

                    <div className="p-4 grid grid-cols-2 gap-4">
                        {products.map(product => (
                            <div key={product.id} className="bg-gray-800 rounded-2xl overflow-hidden border border-gray-700 shadow-xl flex flex-col relative group">
                                {product.oldPrice && (
                                    <div className="absolute top-2 right-2 bg-red-600 text-white text-[10px] font-black px-2 py-1 rounded-full shadow-lg z-10">
                                        SALE
                                    </div>
                                )}
                                
                                <div className="h-48 overflow-hidden relative">
                                    <img src={product.img} alt={product.name} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                                    <div className="absolute bottom-2 left-2 right-2">
                                        <p className="font-bold text-sm text-white truncate drop-shadow-md">{product.name}</p>
                                        <p className="text-[10px] text-gray-300 uppercase tracking-wider">{product.color}</p>
                                    </div>
                                </div>
                                
                                <div className="p-3 flex-grow flex flex-col justify-between bg-gray-800/90 backdrop-blur-sm">
                                    <div className="flex items-center gap-2 mb-3">
                                        <p className="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">₹{product.price}</p>
                                        {product.oldPrice && (
                                            <p className="text-xs text-gray-500 line-through font-bold">₹{product.oldPrice}</p>
                                        )}
                                    </div>
                                    
                                    {/* Size Selector */}
                                    <div className="mb-3">
                                        <select 
                                            value={selectedSizes[product.id] || 'M'} 
                                            onChange={(e) => handleSizeChange(product.id, e.target.value)}
                                            className="w-full bg-gray-900 border border-gray-600 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none focus:border-pink-500 font-bold"
                                        >
                                            <option value="XS">Size: XS</option>
                                            <option value="S">Size: S</option>
                                            <option value="M">Size: M</option>
                                            <option value="L">Size: L</option>
                                            <option value="XL">Size: XL</option>
                                            <option value="XXL">Size: XXL</option>
                                        </select>
                                    </div>

                                    <button onClick={() => addToCart(product)} className="w-full bg-white/5 border border-white/10 text-white py-2.5 rounded-xl text-sm font-black hover:bg-gradient-to-r hover:from-purple-600 hover:to-pink-600 transition-all duration-300 shadow-md">
                                        + ADD TO CART
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const renderCart = () => (
                <div className="p-4 pb-32 min-h-screen bg-gray-900">
                    <div className="flex items-center mb-6">
                        <button onClick={() => setCurrentView('home')} className="mr-4 bg-gray-800 p-2.5 rounded-xl text-white border border-gray-700 hover:bg-gray-700 transition">🔙</button>
                        <h2 className="text-2xl font-black tracking-wide">YOUR CART</h2>
                    </div>

                    {cart.length === 0 ? (
                        <div className="text-center py-20">
                            <div className="text-6xl mb-4">🛒</div>
                            <p className="text-gray-400 font-medium">Your cart is empty.</p>
                            <button onClick={() => setCurrentView('home')} className="mt-6 text-pink-500 font-bold underline decoration-pink-500/30 underline-offset-4">Browse Store</button>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {cart.map((item, idx) => (
                                <div key={idx} className="flex bg-gray-800 p-3 rounded-2xl border border-gray-700 items-center gap-4 shadow-lg">
                                    <img src={item.img} className="w-24 h-24 object-cover rounded-xl shadow-md" />
                                    <div className="flex-1">
                                        <p className="font-bold text-sm text-white line-clamp-1">{item.name}</p>
                                        <p className="text-xs text-gray-400 mt-0.5">Size: <span className="font-bold text-white">{item.size}</span></p>
                                        <p className="text-pink-400 font-black mt-1">₹{item.price}</p>
                                    </div>
                                    <div className="flex flex-col items-center bg-gray-900 rounded-xl border border-gray-700 overflow-hidden shadow-inner">
                                        <button onClick={() => updateQuantity(item.id, item.size, 1)} className="w-8 h-8 flex items-center justify-center text-white hover:bg-gray-800 font-bold">+</button>
                                        <span className="w-8 h-8 flex items-center justify-center font-black text-sm bg-gray-800/50">{item.quantity}</span>
                                        <button onClick={() => updateQuantity(item.id, item.size, -1)} className="w-8 h-8 flex items-center justify-center text-gray-400 hover:bg-gray-800 hover:text-white font-bold">-</button>
                                    </div>
                                </div>
                            ))}

                            {totals.hasFreeShoes && (
                                <div className="bg-gradient-to-r from-green-900/40 to-emerald-900/40 border border-green-500/30 p-4 rounded-2xl mt-6 shadow-[0_0_15px_rgba(16,185,129,0.1)]">
                                    <div className="flex gap-4 items-center">
                                        <img src="https://img.sanishtech.com/u/9e96a5205a6bd4dd5d97fe4ce46a8332.jpg" className="w-20 h-20 rounded-xl object-cover shadow-md border border-green-500/30" />
                                        <div className="flex-1">
                                            <p className="font-black text-green-400 text-sm">🎁 FREE SHOES UNLOCKED!</p>
                                            <p className="text-xs text-gray-300 mt-1">Included with ₹500+ order</p>
                                            <select value={shoeSize} onChange={e => setShoeSize(e.target.value)} className="mt-2 w-full bg-black/40 border border-green-500/30 rounded-lg px-2 py-1.5 text-xs text-white font-bold focus:outline-none focus:border-green-400">
                                                <option value="6">Shoe Size: UK 6</option>
                                                <option value="7">Shoe Size: UK 7</option>
                                                <option value="8">Shoe Size: UK 8</option>
                                                <option value="9">Shoe Size: UK 9</option>
                                                <option value="10">Shoe Size: UK 10</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div className="bg-gray-800 p-5 rounded-2xl border border-gray-700 mt-6 space-y-3 shadow-xl">
                                <div className="flex justify-between text-sm text-gray-400 font-medium"><span>Subtotal</span> <span>₹{totals.rawTotal}</span></div>
                                {totals.discount > 0 && <div className="flex justify-between text-sm text-green-400 font-bold"><span>Combo Discount (3 for 500)</span> <span>-₹{totals.discount}</span></div>}
                                <div className="flex justify-between text-sm text-gray-400 font-medium pb-3 border-b border-gray-700"><span>Delivery Fee</span> <span>₹{DELIVERY_FEE}</span></div>
                                
                                <div className="flex justify-between text-xl font-black text-white pt-1">
                                    <span>Total to Pay</span> <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">₹{totals.finalTotal}</span>
                                </div>
                            </div>

                            <button onClick={() => setCurrentView('address')} className="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-4 rounded-xl font-black text-lg text-white shadow-[0_0_20px_rgba(219,39,119,0.4)] mt-6 hover:scale-[1.02] transition-transform">
                                PROCEED TO ADDRESS ➔
                            </button>
                        </div>
                    )}
                </div>
            );

            const renderAddress = () => (
                <div className="p-4 min-h-screen bg-gray-900 flex flex-col">
                    <div className="flex items-center mb-6">
                        <button onClick={() => setCurrentView('cart')} className="mr-4 bg-gray-800 p-2.5 rounded-xl text-white border border-gray-700">🔙</button>
                        <h2 className="text-2xl font-black tracking-wide">DELIVERY INFO</h2>
                    </div>
                    
                    <form onSubmit={(e) => { e.preventDefault(); setCurrentView('payment'); }} className="space-y-4 flex-grow bg-gray-800 p-5 rounded-2xl border border-gray-700 shadow-xl">
                        
                        <div>
                            <label className="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">House/Flat No. & Building</label>
                            <input type="text" required value={address.house} onChange={e => setAddress({...address, house: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded-xl p-3.5 text-white focus:outline-none focus:border-pink-500 transition-colors shadow-inner" placeholder="E.g. Flat 402, Shivam Appt" />
                        </div>

                        <div>
                            <label className="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">Area, Street & Landmark</label>
                            <input type="text" required value={address.area} onChange={e => setAddress({...address, area: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded-xl p-3.5 text-white focus:outline-none focus:border-pink-500 transition-colors shadow-inner" placeholder="E.g. Near Main Market, MG Road" />
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">City</label>
                                <input type="text" required value={address.city} onChange={e => setAddress({...address, city: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded-xl p-3.5 text-white focus:outline-none focus:border-pink-500 transition-colors shadow-inner" placeholder="City" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">PIN Code</label>
                                <input type="text" required value={address.pin} onChange={e => setAddress({...address, pin: e.target.value.replace(/[^0-9]/g, '')})} maxLength="6" className="w-full bg-gray-900 border border-gray-600 rounded-xl p-3.5 text-white focus:outline-none focus:border-pink-500 transition-colors shadow-inner" placeholder="000000" />
                            </div>
                        </div>

                        <div>
                            <label className="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">State</label>
                            <input type="text" required value={address.state} onChange={e => setAddress({...address, state: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded-xl p-3.5 text-white focus:outline-none focus:border-pink-500 transition-colors shadow-inner" placeholder="State" />
                        </div>

                        <div>
                            <label className="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">Alternate Phone (Optional)</label>
                            <input type="tel" value={address.altPhone} onChange={e => setAddress({...address, altPhone: e.target.value.replace(/[^0-9]/g, '')})} maxLength="10" className="w-full bg-gray-900 border border-gray-600 rounded-xl p-3.5 text-white focus:outline-none focus:border-pink-500 transition-colors shadow-inner" placeholder="10-digit mobile number" />
                        </div>

                        <div className="pt-4 mt-4 border-t border-gray-700">
                            <button type="submit" className="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-4 rounded-xl font-black text-lg text-white shadow-[0_0_20px_rgba(219,39,119,0.4)] hover:scale-[1.02] transition-transform">
                                PROCEED TO PAY ₹{totals.finalTotal}
                            </button>
                        </div>
                    </form>
                </div>
            );

            const renderPayment = () => (
                <div className="p-4 min-h-screen bg-gray-900">
                    <div className="flex items-center mb-6">
                        <button onClick={() => setCurrentView('address')} className="mr-4 bg-gray-800 p-2.5 rounded-xl text-white border border-gray-700">🔙</button>
                        <h2 className="text-2xl font-black tracking-wide">PAYMENT</h2>
                    </div>
                    
                    <div className="bg-gray-800 rounded-3xl p-6 border border-gray-700 text-center shadow-2xl relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-500 to-pink-500"></div>
                        
                        <p className="text-gray-400 text-sm font-bold uppercase tracking-widest mb-2 mt-2">Amount to Pay</p>
                        <p className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 mb-6 drop-shadow-md">₹{totals.finalTotal}</p>
                        
                        <div className="bg-white p-3 rounded-2xl inline-block shadow-[0_0_30px_rgba(255,255,255,0.1)] border-4 border-gray-200">
                            <img src="https://img.sanishtech.com/u/d7a866460a67c80e2733a8529881bad1.png" alt="Scan to Pay" className="w-48 h-48 object-cover rounded-xl" />
                        </div>
                        <p className="text-gray-400 mt-4 text-xs font-bold uppercase tracking-wider">Scan QR code using any UPI App</p>
                        
                        <div className="flex items-center justify-center my-6">
                            <div className="h-px bg-gray-700 flex-grow"></div>
                            <span className="px-4 text-gray-500 text-sm font-black bg-gray-800">OR</span>
                            <div className="h-px bg-gray-700 flex-grow"></div>
                        </div>

                        {/* UPI PAYMENT LINK UPDATED HERE */}
                        <a href={`upi://pay?pa=hiteshdangi4413-2@okhdfcbank&pn=OLN%20BRANDS&am=${totals.finalTotal}&cu=INR`} 
                           className="flex items-center justify-center gap-2 w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white font-black py-4 rounded-xl shadow-[0_0_20px_rgba(16,185,129,0.3)] hover:scale-[1.02] transition-transform text-lg mb-8 border border-green-400/50">
                            PAY NOW VIA APP ⚡
                        </a>

                        <div className="bg-gray-900 p-5 rounded-2xl border border-gray-700 text-left relative">
                            <div className="absolute -top-3 left-4 bg-yellow-500 text-black text-[10px] font-black px-3 py-1 rounded-full tracking-widest shadow-lg">IMPORTANT</div>
                            
                            <p className="text-xs text-gray-300 mb-4 mt-2 font-medium leading-relaxed">Payment complete hone ke baad, apna <strong className="text-white">12-digit UTR / Reference number</strong> yahan darj karein.</p>
                            
                            <form onSubmit={(e) => { e.preventDefault(); if(utr.length === 12) setUtrError(true); }}>
                                <input type="text" placeholder="Enter 12 Digit UTR Number" required value={utr} onChange={e => { setUtr(e.target.value.replace(/[^0-9]/g, '')); setUtrError(false); }} maxLength="12" className="w-full bg-black/50 border border-gray-600 rounded-xl p-4 text-white focus:outline-none focus:border-pink-500 text-center font-mono tracking-[0.3em] text-lg mb-4 shadow-inner" />
                                
                                <button type="submit" disabled={utr.length !== 12} className={`w-full py-4 rounded-xl font-black text-lg transition-all shadow-lg ${utr.length === 12 ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white hover:scale-[1.02]' : 'bg-gray-800 text-gray-600 border border-gray-700 cursor-not-allowed'}`}>
                                    CONFIRM ORDER
                                </button>
                            </form>
                            
                            {/* Error Message */}
                            {utrError && (
                                <div className="mt-5 bg-red-900/30 border border-red-500/50 text-red-400 p-4 rounded-xl font-bold text-center animate-pulse flex items-center justify-center gap-2 text-sm shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                                    <span className="text-xl">❌</span> Order Not Confirmed! Payment Not Done.
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen bg-gray-900 shadow-2xl relative overflow-x-hidden font-sans">
                    {currentView === 'login' && renderLogin()}
                    {currentView === 'home' && renderHome()}
                    {currentView === 'cart' && renderCart()}
                    {currentView === 'address' && renderAddress()}
                    {currentView === 'payment' && renderPayment()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
